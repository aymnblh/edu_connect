name: educonnect

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Caddy terminates TLS and is the only service exposed to the Internet.
  # It uses a static configuration and therefore does not need the Docker socket.
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      FQDN: ${FQDN:?FQDN is required}
      WEB_FQDN: ${WEB_FQDN:?WEB_FQDN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  db:
    image: postgres:16.14-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-edu_connect}
      APP_DB_USER: ${APP_DB_USER:-edu_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/001-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-edu_connect}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 256mb
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  redis:
    image: redis:7.4.10-alpine3.21
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # Private malware scanner. Port 3310 is reachable only on the internal network.
  clamav:
    image: clamav/clamav:stable-debian13-slim
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - internal
      - egress
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    env_file: ${ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-edu_app}:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}@db:5432/${POSTGRES_DB:-edu_connect}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      PORT: "8000"
    volumes:
      - ./secrets:/app/secrets:ro
      - private_media:/app/private_media
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - edge
    logging: *default-logging

  web:
    build:
      context: ../edu_connect_web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${WEB_API_BASE_URL:?WEB_API_BASE_URL is required}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
    logging: *default-logging

networks:
  internal:
    driver: bridge
    internal: true
  edge:
    driver: bridge
  egress:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  clamav_data:
  private_media:
  caddy_data:
  caddy_config:
